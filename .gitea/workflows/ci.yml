name: Test, build and release
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      # The last step publishes directly from this job's temporary workspace.
      contents: write
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          python -m pip install uv==0.12.10 setuptools==80.9.0 wheel==0.45.1
          uv pip install --system --require-hashes -r backend/requirements.txt
          uv pip install --system -r backend/requirements-dev.txt
      - id: version
        name: Check version change
        env:
          BEFORE_SHA: ${{ gitea.event.before }}
          GITEA_SHA: ${{ gitea.sha }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
        run: python scripts/gitea_release.py --check-change
      - name: Backend regression tests
        run: python -m pytest -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build Windows portable package
        run: |
          python desktop/build.py --skip-frontend
          python scripts/validate_package.py "dist/EFDRR-$(cat VERSION)-windows-x64.zip"
      - name: Publish complete release
        if: gitea.ref == 'refs/heads/master' && steps.version.outputs.changed == 'true'
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: python scripts/gitea_release.py
