name: Test, build and release
on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: https://github.com/actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://github.com/actions/setup-node@v4
        with:
          node-version: '24'
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          python -m pip install uv==0.12.10 setuptools==80.9.0 wheel==0.45.1
          uv pip install --system --require-hashes -r backend/requirements.txt
          uv pip install --system -r backend/requirements-dev.txt
      - id: version
        name: Check version change
        env:
          BEFORE_SHA: ${{ gitea.event.before }}
          GITEA_SHA: ${{ gitea.sha }}
          GITEA_EVENT_NAME: ${{ gitea.event_name }}
        run: python scripts/gitea_release.py --check-change
      - name: Backend regression tests
        run: python -m pytest -q
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build Windows portable package
        run: |
          python desktop/build.py --skip-frontend
          python scripts/validate_package.py "dist/EFDRR-$(cat VERSION)-windows-x64.zip"
      # Gitea's v4 artifact backend requires the compatible action linked by Gitea.
      - uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: windows-x64
          path: dist/*
          retention-days: 14
      - uses: https://github.com/ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore

  publish:
    needs: verify
    if: gitea.ref == 'refs/heads/master' && needs.verify.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: https://github.com/ChristopherHX/gitea-download-artifact@75635f32b4c1c41c4b3d64e8f85210112ed4c9c7
        with:
          name: windows-x64
          path: dist
      - name: Publish complete release
        env:
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_SHA: ${{ gitea.sha }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          python -m pip install httpx==0.28.1
          python scripts/gitea_release.py
